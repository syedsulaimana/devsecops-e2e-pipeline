apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: jerney
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: jerney
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/part-of: jerney
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: jerney
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: init-backend
          image: busybox:1.36
          command:
            - 'sh'
            - '-c'
            - |
              echo "Waiting for jerney-db:5432..."
              until nc -z jerney-db 5432; do
                echo "DB not ready, retrying in 3s..."
                sleep 3
              done
              echo "DB is ready!"
      containers:
        - name: backend
          image: your-backend-image:latest
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: "jerney-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              secretKeyRef:
                name: db-secret
                key: POSTGRES_USER
            - name: DB_PASSWORD
              secretKeyRef:
                name: db-secret
                key: POSTGRES_PASSWORD
            - name: DB_NAME
              secretKeyRef:
                name: db-secret
                key: POSTGRES_DB
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

---

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: jerney
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: jerney
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: jerney
    app.kubernetes.io/component: backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000

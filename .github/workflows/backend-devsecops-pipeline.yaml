name: backend-devsecops-pipeline
run-name: "backend-devsecops-pipeline-pr: ${{ github.event.pull_request.number }}"
on:
    pull_request:
      types: [opened, synchronize, reopened]
      branches:
        - main
      paths:
        - 'backend/**'
        - '.github/workflows/backend-devsecops-pipeline.yaml'
permissions:
  contents: read
  id-token: write
jobs:
  set-environment:
    name: "Setting Environment"
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.set-env.outputs.TARGET_ENV }}
    steps:
      - name: "Setting the target environment based on the github events"
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "TARGET_ENV=dev" >> $GITHUB_OUTPUT
          else
            echo "TARGET_ENV=prod" >> $GITHUB_OUTPUT
          fi
  lint:
    defaults:
      run:
        working-directory: ./backend
    name: "Lint Code"
    runs-on: ubuntu-latest
    continue-on-error: true
    needs:
      - set-environment
    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci
      - name: Run backend lint
        run: npm run lint
  sca:
    name: "SCA - Dependency Audit"
    runs-on: ubuntu-latest
    needs:
      - lint
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: "npm"
          cache-dependency-path: 'backend/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Run dependency audit
        run: npm audit --audit-length=high || true
  dockerfile-lint:
    name: "Dockerfile Lint"
    runs-on: ubuntu-latest
    continue-on-error: true
    needs:
      - set-environment
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./backend/Dockerfile
          failure-threshold: warning
  build-and-push-to-aws-ecr:
    name: "Build and Push to AWS ECR"
    runs-on: ubuntu-latest
    needs:
      - set-environment
      - dockerfile-lint
      - lint
      - sca
    environment: ${{ needs.set-environment.outputs.target_env }}
    outputs:
        image_digest: ${{ vars.IMAGE_REGISTRY_BACKEND }}@${{ steps.image.outputs.digest }}
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: "arn:aws:iam::829007908826:role/gha-syedsulaimana-org-pipeline-role"
          role-session-name: github-actions-session
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to AWS ECR
        id: login-to-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build, tag and push to AWS ECR
        id: image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          provenance: mode=max
          push: true
          tags: ${{ vars.IMAGE_REGISTRY_BACKEND }}:${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  image-scan:
    name: "Trivy Image Scan"
    runs-on: ubuntu-latest
    needs:
      - set-environment
      - build-and-push-to-aws-ecr
    environment: ${{ needs.set-environment.outputs.target_env }}
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: "arn:aws:iam::829007908826:role/gha-syedsulaimana-org-pipeline-role"
          role-session-name: github-actions-session-image-scanning
          aws-region: ${{ vars.AWS_REGION }}
      - name: Run trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ vars.IMAGE_REGISTRY_BACKEND }}:${{ github.event.pull_request.head.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: "10m"
  sign-and-attest-images:
    runs-on: ubuntu-latest
    name: "Sign and Attest Images using Cosign"
    needs:
      - set-environment
      - build-and-push-to-aws-ecr
    defaults:
      run:
        working-directory: ./backend
    environment: ${{ needs.set-environment.outputs.target_env }}
    steps:
        - name: Checkout backend code
          uses: actions/checkout@v4
        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v6
          with:
            role-to-assume: "arn:aws:iam::829007908826:role/gha-syedsulaimana-org-pipeline-role"
            role-session-name: github-actions-session
            aws-region: ${{ vars.AWS_REGION }}
        - name: Login to AWS ECR
          uses: aws-actions/amazon-ecr-login@v2
        - name: Create SBOM Report
          uses: aquasecurity/trivy-action@master
          with:
            image-ref: ${{ vars.IMAGE_REGISTRY_BACKEND }}:${{ github.event.pull_request.head.sha }}
            format: 'spdx-json'
            output: 'backend/sbom.json'
            exit-code: '0'
            ignore-unfixed: true
            vuln-type: 'os,library'
            severity: 'CRITICAL,HIGH'
            timeout: "10m"
        - name: Create Vulnerability Report
          uses: aquasecurity/trivy-action@master
          with:
            image-ref: ${{ vars.IMAGE_REGISTRY_BACKEND }}:${{ github.event.pull_request.head.sha }}
            format: 'cosign-vuln'
            output: 'backend/vulnerability.json'
            exit-code: '0'
            ignore-unfixed: true
            vuln-type: 'os,library'
            severity: 'CRITICAL,HIGH'
            timeout: "10m"
        - name: Install Cosign
          uses: sigstore/cosign-installer@v4.1.0
        - name: Check install!
          run: cosign version
        - name: Sign the backend image
          run: |
            cosign sign \
              --key awskms:///arn:aws:kms:ap-south-1:829007908826:key/83b623d3-8ce0-4bed-b4d3-66343d1ccb15 \
              ${{ needs.build-and-push-to-aws-ecr.outputs.image_digest }}
        - name: Attest the backend image's SBOM
          run: |
            cosign attest \
              --key awskms:///arn:aws:kms:ap-south-1:829007908826:key/83b623d3-8ce0-4bed-b4d3-66343d1ccb15 \
              --predicate sbom.json \
              --type spdxjson \
              ${{ needs.build-and-push-to-aws-ecr.outputs.image_digest }}
        - name: Attest the backend image's Vulnerability Scan report
          run: |
            cosign attest \
              --key awskms:///arn:aws:kms:ap-south-1:829007908826:key/83b623d3-8ce0-4bed-b4d3-66343d1ccb15 \
              --predicate vulnerability.json \
              --type vuln \
              ${{ needs.build-and-push-to-aws-ecr.outputs.image_digest }}
        - name: Verify the backend image signature
          run: |
            cosign verify \
              --key awskms:///arn:aws:kms:ap-south-1:829007908826:key/83b623d3-8ce0-4bed-b4d3-66343d1ccb15 \
              ${{ needs.build-and-push-to-aws-ecr.outputs.image_digest }}
        - name: Verify SLSA Provenance Attestation
          run: |
            cosign verify-attestation \
              --key awskms:///arn:aws:kms:ap-south-1:829007908826:key/83b623d3-8ce0-4bed-b4d3-66343d1ccb15 \
              --type slsaprovenance \
              ${{ needs.build-and-push-to-aws-ecr.outputs.image_digest }}

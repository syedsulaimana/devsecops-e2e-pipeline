name: frontend-devsecops-pipeline
run-name: frontend-devsecops-pipeline
on:
    pull_request:
      types: [opened, synchronize, reopened]
      branches:
        - main
      paths:
        - 'frontend/**'
        - '.github/workflows/frontend-devsecops-pipeline.yaml'
permissions:
  contents: read
  id-token: write

jobs:
  set-environment:
    name: "Setting Environment"
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.set-env.outputs.TARGET_ENV }}
    steps:
      - name: "Setting the target environment based on the github events"
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "TARGET_ENV=dev" >> $GITHUB_OUTPUT
          else
            echo "TARGET_ENV=prod" >> $GITHUB_OUTPUT
          fi

  lint:
    defaults:
      run:
        working-directory: ./frontend
    name: "Lint Code"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout frontend code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci
      - name: Run frontend lint
        run: npm run lint

  sca:
    name: "Software Composition Analysis - Dependency Audit"
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout frontend code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: "npm"
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Run dependency audit
        run: npm audit --audit-length=high || true

  aws-assume-role-and-call-identity:
    name: "Assume AWS Role and Call Identity"
    runs-on: ubuntu-latest
    needs:
      - set-environment
    environment: ${{ needs.set-environment.outputs.target_env }}
    steps:
      - name: Checkout frontend code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: "arn:aws:iam::829007908826:role/gha-syedsulaimana-org-pipeline-role"
          role-session-name: github-actions-session
          aws-region: ${{ vars.AWS_REGION }}
      - name: Call AWS STS Get Caller Identity
        run: aws sts get-caller-identity

